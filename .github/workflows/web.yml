name: web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [format, typecheck, build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      # secrets aren't allowed in job-level if, so every step gates on this
      # check instead - the job no-ops green until the secrets exist
      - name: Check for cloudflare secrets
        id: cf
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.cf.outputs.present == 'true'

      - uses: oven-sh/setup-bun@v2
        if: steps.cf.outputs.present == 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.cf.outputs.present == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.cf.outputs.present == 'true'
        run: bun run build

      - name: Deploy to Cloudflare Workers
        if: steps.cf.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
